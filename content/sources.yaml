# Source registry. Every rule, question and outcome cites ids from this file.
#
# type:     regulation | delegated_act | commission_guidance | enisa | ncsc | national_law | interpretation
# binding:  true only for legislation. Guidance and platform documentation are never binding.
# status:   verified | todo   (todo = citation needed before v1; CI warns)
# last_verified: date a maintainer last checked the claim against the source itself.

schema: 1
sources:

  # --- Regulation (EU) 2024/2847 (Cyber Resilience Act) ---------------------
  cra_art2:
    type: regulation
    binding: true
    title: Regulation (EU) 2024/2847 (CRA)
    pinpoint: Art. 2 (scope and exclusions)
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    status: verified
    last_verified: 2026-10-13
  cra_art3:
