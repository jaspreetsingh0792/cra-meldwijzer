# Report templates. Language-neutral: wording lives in content/i18n/*.yaml under `t.`.
#
# Fields follow the NCSC CRA-meldformulier: its JSON schema (embedded in the page) was read on
# 2026-10-13, including the content fields that only appear after choosing a report type.
# `ncsc` is the exact (Dutch) label of the matching form field, so users know where to paste.
# Where Article 14 requires content that has no separate form field, the hint says which form
# field to put it in. The form sets no character limits.
#
# need: legal            - content Article 14 requires for this stage
#       where_applicable - required by Article 14 "where applicable"
#       form             - required by the NCSC form (not by Article 14 itself)
#       recommended      - not required; helps the CSIRT or your own case file
#
# Wording keys: t.section.<id>, t.field.<id>.label, t.field.<id>.hint,
#               t.report.<id>.title, t.report.<id>.ncsc_type, t.report.<id>.deadline

schema: 1
last_reviewed: 2026-10-13

sections:
  case:
    sources: [interpretation, ncsc_form]
    fields:
      - { id: case_id, need: recommended }
      - { id: aware_at, need: recommended }
      - { id: previous_reference, need: recommended, stages: [notification, final_report], ncsc: Referentienummer }
  organisation:
    sources: [ncsc_form]
    fields:
      - { id: org_name, need: form, ncsc: Organisatienaam }
      - { id: kvk, need: form, ncsc: KVK-nummer }
      - { id: hq_street, need: form, ncsc: Straatnaam + huisnummer }
      - { id: hq_postcode, need: form, ncsc: Postcode }
      - { id: hq_city, need: form, ncsc: Plaatsnaam }
      - { id: sector, need: form, ncsc: Sector }
      - { id: other_sector, need: form, ncsc: Valt de organisatie ook onder een andere sector? }
  reporter:
    sources: [ncsc_form]
    fields:
      - { id: first_name, need: form, ncsc: Voornaam }
      - { id: last_name, need: form, ncsc: Achternaam }
      - { id: job_title, need: form, ncsc: Functie melder }
      - { id: email, need: form, ncsc: E-mailadres melder }
      - { id: phone, need: form, ncsc: Telefoonnummer }
      - { id: availability, need: recommended, ncsc: Bereikbaarheid }
      - { id: reporter_is_contact, need: form, ncsc: Is de melder ook contactpersoon voor het incident? }
      - { id: contact_person, need: recommended, multiline: true }

reports:
  vulnerability.early_warning:
    track: vulnerability
    stage: early_warning
    sources: [cra_art14_1_2, ncsc_form, ncsc_melden]
    fields:
      - { id: report_title, need: form, multiline: true, ncsc: Titel van de waarschuwing }
      - { id: products, need: legal, multiline: true, ncsc: Welk(e) product(en) betreft het? }
      - { id: manufacturer_name, need: form, ncsc: Wie is de producent of open-source steward van het product? }
      - { id: member_states, need: where_applicable, ncsc: In welke EU-lidstaten is het product beschikbaar? }
      - { id: sensitivity, need: recommended, multiline: true }

  incident.early_warning:
    track: incident
    stage: early_warning
    sources: [cra_art14_3_5, ncsc_form, ncsc_melden]
    fields:
      - { id: report_title, need: form, multiline: true, ncsc: Titel van de waarschuwing }
      - { id: products, need: legal, multiline: true, ncsc: Welk(e) product(en) betreft het? }
      - { id: manufacturer_name, need: form, ncsc: Wie is de producent of open-source steward van het product? }
      - { id: member_states, need: where_applicable, ncsc: In welke EU-lidstaten is het product beschikbaar? }
      - { id: suspected_malicious, need: legal, ncsc: Wordt het incident vermoedelijk door een onrechtmatige of kwaadwillende handeling veroorzaakt? }
      - { id: sensitivity, need: recommended, multiline: true }

  vulnerability.notification:
    track: vulnerability
    stage: notification
    sources: [cra_art14_1_2, ncsc_form]
    fields:
      - { id: report_title, need: form, multiline: true, ncsc: Titel van de waarschuwing }
      - { id: cve_id, need: recommended, ncsc: CVE-nummer }
      - { id: euvd_id, need: form, ncsc: EUVD-nummer }
      - { id: product_information, need: legal, multiline: true, ncsc: Welk(e) product(en) betreft het? }
      - { id: manufacturer_name, need: form, ncsc: Wie is de producent of open-source steward van het product? }
      - { id: exploit_nature, need: legal, multiline: true, ncsc: Beschrijving van de kwetsbaarheid }
      - { id: member_states, need: form, ncsc: In welke EU-lidstaten is het product beschikbaar? }
      - { id: measures_taken, need: legal, multiline: true, ncsc: Welke maatregelen zijn getroffen om herhaling in de toekomst te voorkomen? }
      - { id: user_measures, need: legal, multiline: true, ncsc: Welke maatregelen zijn er voor eindgebruikers beschikbaar? }
      - { id: sensitivity, need: where_applicable, multiline: true }

  incident.notification:
    track: incident
    stage: notification
    sources: [cra_art14_3_5, ncsc_form]
    fields:
      - { id: report_title, need: form, multiline: true, ncsc: Titel van de waarschuwing }
      - { id: products, need: form, multiline: true, ncsc: Welk(e) product(en) betreft het? }
      - { id: manufacturer_name, need: form, ncsc: Wie is de producent of open-source steward van het product? }
      - { id: incident_discovered_at, need: form, ncsc: Wanneer is de kwetsbaarheid ontdekt? }
      - { id: incident_nature, need: legal, multiline: true, ncsc: Beschrijving van het incident }
      - { id: initial_assessment, need: legal, multiline: true, ncsc: Beschrijving van het incident }
      - { id: incident_detected_at, need: form, ncsc: Wanneer is het incident ontdekt? }
      - { id: incident_occurred_at, need: form, ncsc: Wanneer heeft het incident plaatsgevonden? }
      - { id: member_states, need: form, ncsc: In welke EU-lidstaten is het product beschikbaar? }
      - { id: suspected_malicious, need: form, ncsc: Wordt het incident vermoedelijk door een onrechtmatige of kwaadwillende handeling veroorzaakt? }
      - { id: incident_status, need: form, ncsc: Wat is de status van het incident? }
      - { id: measures_taken, need: legal, multiline: true, ncsc: Welke maatregelen zijn getroffen om herhaling in de toekomst te voorkomen? }
      - { id: user_measures, need: legal, multiline: true, ncsc: Welke maatregelen zijn er voor eindgebruikers beschikbaar? }
      - { id: sensitivity, need: where_applicable, multiline: true }

  vulnerability.final_report:
    track: vulnerability
    stage: final_report
    sources: [cra_art14_1_2, ncsc_form]
    fields:
      - { id: cve_id, need: recommended, ncsc: CVE-nummer }
      - { id: measure_available_at, need: form, ncsc: Sinds wanneer is er een oplossing (patch) beschikbaar voor eindgebruikers? }
      - { id: vulnerability_description, need: legal, multiline: true, ncsc: Wat zijn de potentiële gevolgen van de kwetsbaarheid? }
      - { id: exploitation_known, need: form, ncsc: Is bekend of de kwetsbaarheid actief wordt of is misbruikt? }
      - { id: malicious_actor, need: where_applicable, multiline: true, ncsc: Wat zijn de potentiële gevolgen van de kwetsbaarheid? }
      - { id: security_update, need: legal, multiline: true, ncsc: Geef een gedetailleerde beschrijving van de oplossing (patch) die beschikbaar is }

  incident.final_report:
    track: incident
    stage: final_report
    sources: [cra_art14_3_5, ncsc_form]
    fields:
      - { id: incident_description, need: legal, multiline: true, ncsc: Wat zijn de zichtbare en verwachte gevolgen van het incident? }
      - { id: root_cause, need: legal, multiline: true, ncsc: Wat is de meest waarschijnlijke oorzaak of aanleiding geweest van het incident? }
      - { id: mitigations, need: legal, multiline: true, ncsc: Welke maatregelen zijn getroffen om herhaling in de toekomst te voorkomen? }

# Not a report to the authorities: the information users must receive (Art. 14(8)).
advisory:
  sources: [cra_art14_8, cra_art17]
  fields:
    - { id: advisory_title, need: recommended }
    - { id: affected_products, need: legal, multiline: true }
    - { id: risk, need: recommended, multiline: true }
    - { id: user_actions, need: where_applicable, multiline: true }
    - { id: update_availability, need: where_applicable, multiline: true }
    - { id: vulnerability_ids, need: recommended }
    - { id: contact, need: recommended }
    - { id: next_update, need: recommended }
