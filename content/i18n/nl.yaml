o:
  scope:
    out:
      not_pde: Op basis van je antwoorden lijkt dit geen product met digitale elementen, dus artikel 14 van de CRA lijkt niet van toepassing. Leg je redenering vast.
      not_on_market: Op basis van je antwoorden is het product niet op de EU-markt aangeboden, dus artikel 14 van de CRA lijkt niet van toepassing. Leg je redenering vast.
      excluded: Op basis van je antwoorden lijkt een specifieke CRA-uitzondering te gelden. Controleer de precieze grens van die uitzondering en of de eigen meldregels van die sector in plaats daarvan gelden.
  role:
    importer_distributor: Een importeur of distributeur die het product niet onder eigen naam verkoopt en het niet ingrijpend heeft gewijzigd, heeft geen eigen meldplicht onder artikel 14. Informeer de fabrikant direct en ondersteun diens melding.
    steward: De meldplicht voor opensourcesoftwarebeheerders (artikel 24(3)) geldt vanaf 11 december 2027 en is beperkter dan die van een fabrikant. Breng je dit product ook als fabrikant op de markt, beantwoord de vragen dan als fabrikant.
  track:
    vulnerability:
      reportable: "Op basis van je antwoorden lijkt dit een meldplichtige actief uitgebuite kwetsbaarheid. Vroegtijdige waarschuwing binnen 24 uur na het op de hoogte raken; melding binnen 72 uur na het op de hoogte raken; eindrapport uiterlijk 14 dagen nadat een corrigerende of mitigerende maatregel beschikbaar is."
      potentially_reportable: "Actief uitgebuite kwetsbaarheid: mogelijk meldplichtig, dringende beoordeling nodig. Houd het vroegst denkbare moment van op de hoogte raken aan, schaal op naar je incident- en juridische verantwoordelijken en overweeg het CSIRT om advies te vragen. Wacht niet op een volledige forensische conclusie."
      not_reportable: Op basis van je antwoorden is er geen actief uitgebuite kwetsbaarheid die je onder artikel 14 moet melden. Leg je redenering vast, behandel de kwetsbaarheid via je normale proces en beoordeel opnieuw als er bewijs van misbruik opduikt. Vrijwillig melden (artikel 15) blijft mogelijk.
      no_retroactive_duty: "Je werd vóór 11 september 2026 op de hoogte van het misbruik. Volgens de FAQ van ENISA (vraag 13, met verwijzing naar de FAQ van de Commissie over de uitvoering van de CRA) geldt dan geen meldplicht met terugwerkende kracht. Dit is een richtsnoer, niet de tekst van de verordening. Het geldt niet meer als je na die datum op de hoogte raakt van nieuw misbruik. Bewaar het bewijs voor je datum van op de hoogte raken."
    incident:
      reportable: "Op basis van je antwoorden lijkt dit een meldplichtig ernstig incident. Vroegtijdige waarschuwing binnen 24 uur na het op de hoogte raken, inclusief of je onrechtmatige of kwaadwillige handelingen vermoedt; melding binnen 72 uur na het op de hoogte raken; eindrapport binnen één maand na het indienen van de melding."
      potentially_reportable: "Ernstig incident: mogelijk meldplichtig, dringende beoordeling nodig. Houd het vroegst denkbare moment van op de hoogte raken aan, schaal op naar je incident- en juridische verantwoordelijken en overweeg het CSIRT om advies te vragen. Wacht niet op een volledige forensische conclusie."
      not_reportable: Op basis van je antwoorden is er geen ernstig incident dat je onder artikel 14 moet melden. Leg je redenering vast en beoordeel opnieuw als er nieuwe feiten zijn. Vrijwillig melden (artikel 15) blijft mogelijk.
  caveat:
    scope_or_role_unsure: De reikwijdte of je rol is onzeker, dus de uitkomst hierboven is hooguit "mogelijk meldplichtig". Zolang dat niet duidelijk is, is het voorzichtig om de termijnen te laten lopen vanaf het moment van op de hoogte raken, en reikwijdte en rol met spoed vast te stellen.
    pre_application_check: Je werd vóór 11 september 2026 op de hoogte, maar de beoordeling is niet afgerond. Controleer of nieuwe feiten of nieuw misbruik na die datum een nieuw moment van op de hoogte raken opleveren.
    pre_application_incident: Je werd vóór 11 september 2026 op de hoogte van het incident. De FAQ van ENISA over het ontbreken van een meldplicht met terugwerkende kracht gaat alleen over actief uitgebuite kwetsbaarheden; voor ernstige incidenten bestaat zo'n richtsnoer niet. Behandel het incident als mogelijk meldplichtig en vraag het NCSC of je juridisch adviseur.
    awareness_unsure: Je weet niet zeker wanneer je op de hoogte raakte. Gebruik het vroegst denkbare moment voor je termijnen.
  routing:
    nl: Meld bij het NCSC via MijnNCSC (aanbevolen; inloggen met eHerkenning of SSOnRijk) of via het CRA-meldformulier (geen account nodig; bewaar het referentienummer voor vervolgmeldingen). Het NCSC stuurt je melding door naar ENISA en naar de CSIRT's van andere lidstaten. Meld dezelfde zaak niet nog een keer bij ENISA.
    other_eu: Meld bij het coördinerende CSIRT van de lidstaat van je hoofdvestiging, via de officiële meldroute van dat CSIRT. ENISA publiceert de lijst van coördinerende CSIRT's.
    non_eu: "Zonder hoofdvestiging in de EU bepaalt artikel 14(7) de lidstaat in deze volgorde: waar je gemachtigde voor de meeste producten gevestigd is; anders de importeur die de meeste van je producten in de handel brengt; anders de distributeur die er de meeste aanbiedt; anders de lidstaat met de meeste gebruikers."
    unsure: "Bepaal eerst je hoofdvestiging (artikel 14(7)): waar beslissingen over de cyberbeveiliging van de producten overwegend worden genomen; anders waar de fabrikant de meeste werknemers in de EU heeft. Laat dit je vroegtijdige waarschuwing niet vertragen."
  parallel:
    cbw: "Beoordeel apart of dit een significant incident is onder de Cyberbeveiligingswet (per sector gelden drempelwaarden). Die wet heeft een eigen toets en een eigen melding, via het centrale meldpunt op MijnNCSC, waarmee je je sectorale CSIRT en de toezichthouder bereikt: vroegtijdige waarschuwing binnen 24 uur, melding binnen 72 uur, eindverslag binnen één maand na de melding. Een CRA-melding vervangt die niet. Sectorwetten zoals DORA kunnen een eigen route hebben."
    cbw_check: Controleer of je organisatie onder de Cyberbeveiligingswet valt. Zo ja, beoordeel deze gebeurtenis apart.
    gdpr: Beoordeel apart of dit een datalek is onder de AVG. De verwerkingsverantwoordelijke meldt dit binnen 72 uur na het op de hoogte raken bij de Autoriteit Persoonsgegevens, tenzij het waarschijnlijk geen risico voor personen oplevert.
  action:
    record_awareness: "Leg nu drie dingen vast: wanneer het probleem voor het eerst werd gedetecteerd, wanneer je op de hoogte raakte (jouw beoordeling) en waarom op dat moment."
    consider_users: "Geen melding met terugwerkende kracht betekent niet dat er niets te doen is. Ga na of getroffen gebruikers nog informatie of maatregelen nodig hebben om zich te beschermen, en blijf monitoren: raak je na 11 september 2026 op de hoogte van nieuw misbruik, dan begint de meldplicht."
    inform_users: Informeer getroffen gebruikers (en waar passend alle gebruikers) over het probleem en de mitigerende of corrigerende maatregelen die zij kunnen nemen, waar passend in een gestructureerd, machineleesbaar formaat (artikel 14(8)). Dit staat los van je melding aan de autoriteiten.

t:
  doc:
    form_type: "NCSC-formulier, \"Welk soort melding maak je?\""
    deadline: Termijn
    sources: Bronnen
    fill_in: "[invullen]"
    prepared_in_advance: Bereid dit voor vóór een incident; het is voor elke melding hetzelfde.
    not_a_report: Dit is geen melding aan de autoriteiten. Het is de informatie die je gebruikers volgens artikel 14(8) moet geven.
    disclaimer: Sjabloon van CRA Meldwijzer. Geen juridisch advies; niet juridisch getoetst. Controleer het actuele NCSC-formulier voordat je indient.
    advisory_title: Beveiligingsadvies voor gebruikers
    ncsc_field: Veld op het NCSC-formulier
  need:
    legal: Verplicht volgens artikel 14
    where_applicable: Verplicht waar van toepassing
    form: Verplicht op het NCSC-formulier
    recommended: Aanbevolen
  section:
    case: Zaak
    organisation: Organisatiegegevens (NCSC-formulier)
    reporter: Melder (NCSC-formulier)
    content: Inhoud van de melding
  report:
    vulnerability:
      early_warning:
        title: "Vroegtijdige waarschuwing: actief uitgebuite kwetsbaarheid"
        ncsc_type: Vroegtijdige waarschuwing - van een actief misbruikte kwetsbaarheid
        deadline: Zonder onnodige vertraging, en in elk geval binnen 24 uur na het op de hoogte raken.
      notification:
        title: "Melding: actief uitgebuite kwetsbaarheid"
        ncsc_type: Melding - over een actief misbruikte kwetsbaarheid
        deadline: Zonder onnodige vertraging, en in elk geval binnen 72 uur na het op de hoogte raken (niet na de vroegtijdige waarschuwing). Informatie die je al gaf hoef je niet te herhalen.
      final_report:
        title: "Eindrapport: actief uitgebuite kwetsbaarheid"
        ncsc_type: Eindverslag - over een actief misbruikte kwetsbaarheid
        deadline: Uiterlijk 14 dagen nadat een corrigerende of mitigerende maatregel beschikbaar is.
    incident:
      early_warning:
        title: "Vroegtijdige waarschuwing: ernstig incident"
        ncsc_type: Vroegtijdige waarschuwing - van een ernstig incident
        deadline: Zonder onnodige vertraging, en in elk geval binnen 24 uur na het op de hoogte raken.
      notification:
        title: "Melding: ernstig incident"
        ncsc_type: Melding - over een ernstig incident
        deadline: Zonder onnodige vertraging, en in elk geval binnen 72 uur na het op de hoogte raken (niet na de vroegtijdige waarschuwing). Informatie die je al gaf hoef je niet te herhalen.
      final_report:
        title: "Eindrapport: ernstig incident"
        ncsc_type: Eindverslag - over een ernstig incident
        deadline: Binnen één maand na het indienen van de melding over het incident.
  field:
    case_id: { label: Intern zaaknummer, hint: "Je eigen referentie. Niet naar het NCSC sturen, tenzij het helpt." }
    aware_at: { label: Op de hoogte geraakt op, hint: "Datum, tijd en tijdzone, plus waarom op dat moment. Het CRA-formulier vraagt er niet om, maar je termijnen lopen vanaf dit moment: bewaar het in je zaakdossier." }
    previous_reference: { label: NCSC-referentie van de eerdere melding, hint: "Uit MijnNCSC, of het referentienummer dat je per e-mail kreeg bij het CRA-meldformulier. Koppelt deze melding aan dezelfde zaak." }
    org_name: { label: Organisatienaam, hint: De juridische entiteit die fabrikant is van dit product. }
    kvk: { label: KVK-nummer, hint: "Precies 8 cijfers (het formulier controleert dit)." }
    hq_street: { label: Straatnaam en huisnummer, hint: Van de hoofdvestiging. }
    hq_postcode: { label: Postcode, hint: Van de hoofdvestiging. }
    hq_city: { label: Plaatsnaam, hint: Van de hoofdvestiging. }
    sector: { label: Sector, hint: "Kies uit de lijst op het formulier. Fabrikanten kiezen vaak \"Vervaardiging\" of \"Digitale aanbieders\"; kies wat past, of \"Anders\"." }
    other_sector: { label: Ook actief in een andere sector?, hint: "Ja of nee; bij ja vraagt het formulier welke." }
    first_name: { label: Voornaam, hint: "" }
    last_name: { label: Achternaam, hint: "" }
    job_title: { label: Functie, hint: "" }
    email: { label: E-mailadres, hint: "Gebruik een adres dat tijdens het incident wordt gelezen, ook in het weekend." }
    phone: { label: Telefoonnummer, hint: "Het formulier accepteert alleen Nederlandse nummers (beginnend met 0 of +31)." }
    availability: { label: Bereikbaarheid, hint: Dagen en tijden waarop je telefonisch bereikbaar bent. }
    reporter_is_contact: { label: Is de melder ook contactpersoon voor deze zaak?, hint: "Ja of nee." }
    contact_person: { label: Contactpersoon (als dat niet de melder is), hint: "Verplicht op het formulier als de melder niet de contactpersoon is: voornaam, achternaam, functietitel, e-mailadres, telefoonnummer (Nederlands) en bereikbaarheid." }
    report_title: { label: Titel, hint: "Zo kort mogelijk, bijvoorbeeld: \"Actief misbruikte kwetsbaarheid in firmware HR-200-router\". De vroegtijdige waarschuwing heeft geen beschrijvingsveld, dus de titel draagt de boodschap." }
    products: { label: Getroffen producten en versies, hint: "Elk getroffen product en elke versie. Vergeet oudere versies die nog in gebruik zijn niet." }
    manufacturer_name: { label: Fabrikant of opensourcebeheerder, hint: De juridische entiteit die fabrikant (of steward) van het product is. }
    suspected_malicious: { label: Vermoeden van onrechtmatige of kwaadwillige handelingen?, hint: "Ja of nee op het formulier. Bewaar een korte toelichting in je zaakdossier." }
    member_states: { label: Lidstaten waar het product beschikbaar is, hint: "Vink elke EU-lidstaat aan waarvan je weet dat het product daar is aangeboden. Het formulier vereist er minstens één." }
    sensitivity: { label: Gevoeligheid van de informatie, hint: "Of details aanvallers kunnen helpen (bijvoorbeeld zolang er geen fix is), en waarom. Artikel 14 vraagt hierom waar van toepassing; het formulier heeft geen apart veld, dus vermeld het in de beschrijving en kijk of je de melding in MijnNCSC als gevoelig kunt markeren." }
    cve_id: { label: CVE-nummer, hint: Als het is toegekend. }
    euvd_id: { label: EUVD-nummer, hint: "Kenmerk in de European Vulnerability Database. Het formulier maakt dit verplicht. Bestaat het nog niet, vermeld dat in het veld en overleg met het NCSC." }
    product_information: { label: Algemene informatie over het product, hint: "Wat het product is, welke versies geraakt zijn, hoe het wordt gebruikt." }
    exploit_nature: { label: Algemene aard van het misbruik en van de kwetsbaarheid, hint: "Soort kwetsbaarheid, hoe die wordt misbruikt, wat een aanvaller ermee kan. Geen stappenplan." }
    measures_taken: { label: Genomen corrigerende of mitigerende maatregelen, hint: "Het formulier vraagt naar het voorkomen van herhaling. Artikel 14 vraagt naar de al genomen corrigerende of mitigerende maatregelen: beschrijf hier beide." }
    user_measures: { label: Maatregelen die gebruikers kunnen nemen, hint: "Wat gebruikers nu moeten doen: updaten, workaround, configuratie aanpassen, loskoppelen." }
    vulnerability_ids: { label: Kenmerken van de kwetsbaarheid, hint: "CVE- en EUVD-nummers, als die zijn toegekend." }
    incident_discovered_at: { label: "Ontdekt op (formulier vraagt \"wanneer is de kwetsbaarheid ontdekt\")", hint: "Bij de melding over een incident gaat de vraag op het formulier over de kwetsbaarheid, maar de toelichting vraagt om datum en tijd van de ontdekking van het incident, in CET. Vul het ontdekmoment in; vermeld het als er geen kwetsbaarheid bij betrokken is." }
    incident_nature: { label: Aard van het incident, hint: "Wat er gebeurde, welke systemen geraakt zijn, hoe het de beveiliging van het product raakt. Hoort in het beschrijvingsveld van het formulier." }
    initial_assessment: { label: Eerste beoordeling, hint: "Ernst, omvang en waarschijnlijke impact voor zover bekend, en hoe zeker je bent. Verplicht volgens artikel 14; het formulier heeft geen apart veld, dus voeg het toe aan de beschrijving van het incident." }
    incident_detected_at: { label: Incident ontdekt op, hint: "Datum en tijd, CET (Nederlandse tijd)." }
    incident_occurred_at: { label: Incident vond plaats op, hint: "Datum en tijd, CET (Nederlandse tijd). Beste schatting als het niet precies bekend is." }
    incident_status: { label: Status van het incident, hint: "Het formulier biedt: oorzaak onduidelijk, in onderzoek / oorzaak duidelijk, niet afgehandeld / oorzaak duidelijk, afgehandeld." }
    vulnerability_description: { label: Beschrijving van de kwetsbaarheid, hint: "Inclusief ernst en impact (artikel 14). Het veld op het formulier vraagt naar potentiële gevolgen: geef daar de volledige beschrijving." }
    exploitation_known: { label: Is misbruik bekend?, hint: "Ja of nee op het formulier." }
    malicious_actor: { label: Informatie over de kwaadwillende actor, hint: "Alleen waar beschikbaar (artikel 14). Het formulier heeft geen apart veld: voeg het toe aan de beschrijving." }
    security_update: { label: Beveiligingsupdate of andere corrigerende maatregelen, hint: "Welke update of maatregel beschikbaar is, sinds wanneer, en hoe gebruikers die krijgen." }
    measure_available_at: { label: Maatregel beschikbaar sinds, hint: "Datum en tijd waarop de corrigerende of mitigerende maatregel beschikbaar kwam. Daarmee begon de termijn van 14 dagen." }
    incident_description: { label: Gedetailleerde beschrijving van het incident, hint: "Inclusief ernst en impact. Het formulier vraagt naar de zichtbare en verwachte gevolgen: geef daar de volledige beschrijving." }
    root_cause: { label: Soort dreiging of grondoorzaak, hint: Wat het incident waarschijnlijk veroorzaakte. }
