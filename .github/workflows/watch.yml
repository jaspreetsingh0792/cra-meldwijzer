name: Source watch

# Weekly check of the official sources. Opens or updates an issue per changed source,
# and one issue when sources are overdue for review. No AI, no secrets beyond GITHUB_TOKEN.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/watch-sources.mjs --issues
        env:
          GH_TOKEN: ${{ github.token }}
